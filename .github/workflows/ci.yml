name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so every commit can be scanned
      - name: Sensitive-content scan (all history, all file versions, commit metadata)
        run: python3 tools/precommit_scan.py --history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test (synthetic data only; real-data model parity tests skip without local models)
        run: dotnet test -c Release --no-build
