<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trademaster Markets</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0e11;--panel:#14181d;--panel2:#1b2027;--line:#262c34;--text:#e6e9ee;--muted:#8a93a0;--dim:#5d6672;--up:#16c784;--down:#f6465d;--accent:#3b82f6;--warn:#f0b90b;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.dim{color:var(--dim)}
a{color:#7cc4ff;text-decoration:none}a:hover{text-decoration:underline}
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.crumbs{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.crumbs a{color:var(--muted)}.crumbs b{color:var(--text);font-weight:600}
.spacer{flex:1}
.search{position:relative}.search input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;width:260px}
.sugg{position:absolute;top:36px;right:0;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none;z-index:9}
.sugg div{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}.sugg div:hover,.sugg div.on{background:var(--panel2)}
.chip{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.real{color:#7cc4ff;border-color:#1d3f63;background:#0f2134}.chip.warn{color:var(--warn);border-color:#5a4a12;background:#2a2410}.chip.ok{color:var(--up);border-color:#164d36;background:#0f2a20}.chip.bad{color:var(--down);border-color:#5a1f29;background:#2c1217}
.links a{color:var(--muted);margin-left:10px;white-space:nowrap}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
nav#tree{border-right:1px solid var(--line);background:var(--panel);padding:10px 0;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
#tree .grp{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:12px 16px 4px}
#tree a{display:flex;align-items:center;gap:8px;padding:6px 16px;color:var(--muted);border-left:2px solid transparent}
#tree a:hover{background:var(--panel2);text-decoration:none;color:var(--text)}
#tree a.on{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
#tree a.l1{font-weight:600;color:var(--text)}#tree a.l2{padding-left:30px}#tree a.l3{padding-left:44px;font-size:12.5px}
#tree .tag{margin-left:auto;font-size:10px}
#navsel{display:none;margin:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit;width:calc(100% - 20px)}
main{padding:16px;display:grid;gap:14px;align-content:start;max-width:1400px;width:100%}
h1{font-size:18px;margin:0;font-weight:600}h1 .chip{vertical-align:middle;margin-left:8px}
.lead{color:var(--muted);max-width:900px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.card h3{margin:0 0 8px;font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px}.kv div:nth-child(odd){color:var(--muted)}.kv div:nth-child(even){text-align:right;font-family:var(--mono)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pad{padding:10px 12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}.two>*{min-width:0}
.mcard{cursor:pointer}.mcard:hover{border-color:#34404d}
.chart{height:260px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 10px;text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
th.sort{cursor:pointer}th.sort:hover{color:var(--text)}th.sort.on{color:var(--text)}
td:first-child,th:first-child{text-align:left}tbody tr{border-bottom:1px solid #1a1f25}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#171c22}
td.name{text-align:left;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.scroll{max-height:calc(100vh - 250px);overflow:auto}
.bar{display:inline-block;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle}
.why{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}.why span{font-size:10px;padding:0 5px;border-radius:3px;background:var(--panel2);color:var(--muted)}.why span.hi{color:var(--up)}.why span.lo{color:var(--down)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;width:200px}
.seg button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:4px 10px;font:inherit;cursor:pointer;margin-right:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rng{position:relative;display:inline-block;width:130px;height:12px;vertical-align:middle}
.rng .r95{position:absolute;top:5px;height:2px;background:#3a4452;border-radius:1px}
.rng .r80{position:absolute;top:3px;height:6px;background:#2f5f9f;border-radius:2px}
.rng .cur{position:absolute;top:0;width:2px;height:12px;background:var(--text)}
.rng .med{position:absolute;top:1px;width:6px;height:10px;margin-left:-3px;border-radius:2px}
.big .rng{width:100%;height:22px}.big .rng .r95{top:10px;height:3px}.big .rng .r80{top:6px;height:11px}.big .rng .cur{height:22px}.big .rng .med{height:18px;top:2px}
.gauge{height:10px;border-radius:5px;background:linear-gradient(90deg,#5a1f29,#262c34 50%,#164d36);position:relative}
.gauge i{position:absolute;top:-3px;width:4px;height:16px;background:var(--text);border-radius:2px;margin-left:-2px}
.empty{color:var(--dim);padding:24px;text-align:center}
.spinwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(20,24,29,.72);z-index:3;color:var(--text);font-weight:600}
.spinwrap .sub{color:var(--muted);font-weight:400;font-size:12px}
.ring{width:22px;height:22px;border:3px solid #2f3a47;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reasons ul{margin:4px 0 0;padding-left:18px}.reasons li{margin:3px 0;line-height:1.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;text-transform:none;letter-spacing:0;font-size:12px}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
@media (max-width:760px){.reasons{grid-template-columns:1fr}}
@media (max-width:760px){.layout{grid-template-columns:1fr}nav#tree{display:none}#navsel{display:block}.two{grid-template-columns:1fr}
  header{gap:8px;flex-wrap:wrap;height:auto;padding:8px 10px}.crumbs{order:3;width:100%}.search input{width:150px}.links{display:none}.sugg{width:280px}main{padding:10px}}
*{scrollbar-width:thin;scrollbar-color:#2e333c transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#2e333c;border-radius:4px;border:2px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<header>
  <span class="brand">AI Trademaster</span>
  <span class="crumbs" id="crumbs"></span>
  <div class="spacer"></div>
  <span class="chip" id="upd" style="display:none"></span>
  <span class="chip warn" title="Research only: no orders are ever placed">RESEARCH ONLY</span>
  <div class="search"><input id="q" placeholder="Search a stock, company, index or sector" autocomplete="off"><div class="sugg" id="sugg"></div></div>
</header>
<div class="layout">
  <nav id="tree"></nav>
  <div><select id="navsel" aria-label="Go to"></select><main id="view"><div class="empty">Loading…</div></main></div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = id => document.getElementById(id);
const pct = (v, d = 1, sign = true) => v == null || !isFinite(v) ? '—' : (sign && v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const px = v => v == null || !isFinite(v) ? '—' : v >= 100 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
const pup = p => p == null || !isFinite(p) ? '—' : `<span class="${p >= 0.52 ? 'up' : p <= 0.48 ? 'down' : ''}">${(p * 100).toFixed(0)}%</span>`;
const WHY = { mom12_1: 'momentum', resid_mom12_1: 'own momentum', dist_252_high: 'near 52w high', vol60: 'volatility', max_ret21: 'lottery spikes',
  earnings_yield: 'earnings yield', gross_profitability: 'profitability', sue: 'earnings surprise', ind_mom126: 'industry trend' };

// ---------------------------------------------------------------- hierarchy
const MARKETS = {
  nasdaq: { region: 'United States', name: 'NASDAQ', bench: 'QQQ', ccy: '$', periods: ['dev 2021–24', 'test 2025–26'],
    views: [['overview', 'Overview'], ['indexes', 'Indexes & sectors'], ['rankings', 'Rankings'], ['forecasts', 'Price forecasts'], ['news', 'News (AI read)'], ['record', 'Model record']] },
  sgx: { region: 'Singapore', name: 'SGX', bench: 'STI proxy', ccy: 'S$', periods: ['dev 2016–22', 'test 2023–26'],
    views: [['overview', 'Overview'], ['rankings', 'Rankings'], ['forecasts', 'Price forecasts'], ['momentum', 'Momentum test'], ['record', 'Model record']] },
};
const DATA = {}, LOADING = {};
let MOM = null;
async function data(m) {
  if (DATA[m]) return DATA[m];
  if (!LOADING[m]) LOADING[m] = fetch('/api/rankings' + (m === 'sgx' ? '?market=sgx' : '')).then(async r => {
    if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }).then(d => (DATA[m] = d)).catch(e => (DATA[m] = { error: String(e.message || e) }));
  return LOADING[m];
}
async function momentum() {
  if (MOM) return MOM;
  try { MOM = await (await fetch('/api/sgx/momentum')).json(); } catch (e) { MOM = { status: 'none' }; }
  return MOM;
}
function statusChip(d) {
  const a = d && d.status ? d.status.adopted : null;
  return a === true ? '<span class="chip ok">ADOPTED</span>' : a === false ? '<span class="chip bad">NOT ADOPTED</span>' : '<span class="chip warn">TEST PENDING</span>';
}
function route() {
  const p = (location.hash || '#/all').slice(2).split('/');
  const m = MARKETS[p[0]] ? p[0] : null;
  if (!m) return { m: null, v: 'all' };
  if (p[1] === 'stock' && p[2]) return { m, v: 'stock', sym: decodeURIComponent(p[2]) };
  if (p[1] === 'sector' && p[2]) return { m, v: 'sector', key: decodeURIComponent(p[2]) };
  if (p[1] === 'index' && p[2]) return { m, v: 'index', sym: decodeURIComponent(p[2]) };
  return { m, v: MARKETS[m].views.some(x => x[0] === p[1]) ? p[1] : 'overview' };
}
function buildTree(r) {
  let h = `<a href="#/all" class="l1 ${r.v === 'all' ? 'on' : ''}">All markets</a>`;
  let opts = `<option value="#/all">All markets</option>`;
  for (const [k, M] of Object.entries(MARKETS)) {
    h += `<div class="grp">${M.region}</div><a href="#/${k}/overview" class="l2 ${r.m === k && r.v === 'overview' ? 'on' : ''}"><b>${M.name}</b>` +
      `<span class="tag" id="tag-${k}"></span></a>`;
    for (const [v, label] of M.views.slice(1)) {
      h += `<a href="#/${k}/${v}" class="l3 ${r.m === k && r.v === v ? 'on' : ''}">${label}</a>`;
    }
    for (const [v, label] of M.views) opts += `<option value="#/${k}/${v}">${M.name} › ${label}</option>`;
  }
  $('tree').innerHTML = h;
  $('navsel').innerHTML = opts + (['stock', 'sector', 'index'].includes(r.v) ? `<option value="${location.hash}">${MARKETS[r.m].name} › ${esc(r.sym || r.key)}</option>` : '');
  $('navsel').value = location.hash || '#/all';
  for (const k of Object.keys(MARKETS)) if (DATA[k] && !DATA[k].error) {
    const a = DATA[k].status ? DATA[k].status.adopted : null;
    const t = $('tag-' + k); if (t) t.innerHTML = a === true ? '<span class="up">●</span>' : a === false ? '<span class="down">●</span>' : '<span class="dim">●</span>';
  }
}
function crumbs(r, last) {
  const parts = [`<a href="#/all">Markets</a>`];
  if (r.m) { const M = MARKETS[r.m]; parts.push(esc(M.region), `<a href="#/${r.m}/overview">${M.name}</a>`); }
  if (last) parts.push(`<b>${esc(last)}</b>`);
  $('crumbs').innerHTML = parts.join(' › ');
}

// ---------------------------------------------------------------- shared pieces
function card(title, kv) {
  return `<div class="card"><h3>${title}</h3><div class="kv">${kv.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join('')}</div></div>`;
}
function why(r) {
  return Object.entries(r.why || {}).filter(([, v]) => isFinite(v)).sort((a, b) => Math.abs(b[1] - 0.5) - Math.abs(a[1] - 0.5)).slice(0, 3)
    .map(([k, v]) => `<span class="${v > 0.5 ? 'hi' : 'lo'}" title="${esc(k)} rank ${(v * 100).toFixed(0)} of 100">${v > 0.5 ? '▲' : '▼'} ${esc(WHY[k] || k)}</span>`).join('');
}
function rangeBar(r) {
  const f = r.fc; if (!f) return '<span class="dim">—</span>';
  const lo = f.lo95, hi = f.hi95, w = hi - lo; if (!(w > 0)) return '';
  const pos = v => Math.max(0, Math.min(100, (v - lo) / w * 100));
  return `<span class="rng" title="95%: ${px(f.lo95)}–${px(f.hi95)} · 80%: ${px(f.lo80)}–${px(f.hi80)} · median ${px(f.median)} · now ${px(r.close)}">` +
    `<span class="r95" style="left:0;width:100%"></span><span class="r80" style="left:${pos(f.lo80)}%;width:${pos(f.hi80) - pos(f.lo80)}%"></span>` +
    `<span class="med" style="left:${pos(f.median)}%;background:${f.median >= r.close ? 'var(--up)' : 'var(--down)'}"></span>` +
    `<span class="cur" style="left:${pos(r.close)}%"></span></span>`;
}
const go = (m, sym) => `location.hash='#/${m}/stock/${encodeURIComponent(sym)}'`;
function shortRow(m, r) {
  return `<tr class="click" onclick="${go(m, r.symbol)}"><td><b>${esc(r.symbol)}</b></td><td class="name">${esc(r.name)}</td><td class="num">${px(r.close)}</td>` +
    `<td class="num">${r.score_pct.toFixed(0)}</td><td class="num">${r.fc ? px(r.fc.median) : '—'}</td><td>${rangeBar(r)}</td><td class="num">${pup(r.fc && r.fc.p_up)}` +
    `${r.fc && r.fc.news && r.fc.news.n ? ` <span class="dim">→</span> ${pup(r.fc.news.p_up)}` : ''}</td><td><div class="why">${why(r)}</div></td></tr>`;
}
const SHORT_HEAD = '<tr><th>Symbol</th><th style="text-align:left">Company</th><th>Close</th><th>Score</th><th>5-day median</th><th>95% / 80% range</th><th>P(up)</th><th>Why</th></tr>';
function caveat(m, d) {
  const out = [];
  if (m === 'sgx') out.push('Built from Eulerpool data: only companies listed today (stocks that delisted in the past are missing, so past results look better than reality). Market = a home-made STI proxy, not the real STI.');
  if (d.status && d.status.adopted === false) out.push('The stock ranking failed its pre-registered final test, so treat the order as information, not a signal.');
  out.push('Price forecasts are in a forward test: ranges have been well calibrated; up/down is right only ~51–52% of the time on a typical stock.');
  return `<div class="lead">${out.map(esc).join(' ')}</div>`;
}

// ---------------------------------------------------------------- data freshness: which close, when the next one comes
const SESS = { nasdaq: { tz: 'America/New_York', open: [9, 30], close: [16, 0], name: 'US' }, sgx: { tz: 'Asia/Singapore', open: [9, 0], close: [17, 0], name: 'SGX' } };
let LASTCHECK = null;                                            // time of the last update check (from /api/rankings/status)
function zoned(day, [h, mi], tz) {                               // a wall-clock time in tz on `day` (YYYY-MM-DD) as a Date
  const [y, mo, d] = day.split('-').map(Number), guess = Date.UTC(y, mo - 1, d, h, mi);
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' })
    .formatToParts(new Date(guess)).map(x => [x.type, x.value]));
  const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
  return new Date(guess - (shown - guess));
}
let lastPull = 0;
function pullNow() {                                              // ask the app to fetch the new close (at most every 15 min)
  if (Date.now() - lastPull < 15 * 60000) return;
  lastPull = Date.now();
  fetch('/api/refresh', { method: 'POST' }).catch(() => { });
}
function fresh(m, asof) {
  const S = SESS[m]; if (!S || !asof) return '';
  let d = new Date(asof + 'T12:00:00Z');
  do { d = new Date(d.getTime() + 86400000); } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
  const nd = d.toISOString().slice(0, 10), open = zoned(nd, S.open, S.tz), close = zoned(nd, S.close, S.tz), now = new Date();
  const loc = t => t.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const day = new Date(asof + 'T12:00:00Z').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const next = now < open ? `This is the latest: the next ${S.name} session opens ${loc(open)} your time.`
    : now < close ? `The ${S.name} market is open now; today's close is added after it ends at ${loc(close)} your time (forecasts never use an unfinished day).`
    : (pullNow(), `A newer ${S.name} close should now exist: pulling it now (this page updates by itself when done).`);
  return `<span title="Prices are daily closes; the app checks for new ones each time it opens">Data: ${S.name} close of ${day}. ${next}` +
    (LASTCHECK ? ` Last checked ${new Date(LASTCHECK).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}.` : '') + `</span>`;
}

// ---------------------------------------------------------------- views
async function viewAll() {
  crumbs({ m: null }, 'All markets');
  const [n, s, mo] = await Promise.all([data('nasdaq'), data('sgx'), momentum()]);
  const one = (k, d) => {
    const M = MARKETS[k];
    if (!d || d.error) return `<div class="card"><h3>${M.name}</h3><div class="dim">No data yet (${esc(d && d.error)})</div></div>`;
    const withFc = d.rankings.filter(r => r.fc);
    const byUp = withFc.slice().sort((a, b) => b.fc.p_up - a.fc.p_up);
    const li = r => `<div class="click" style="display:flex;gap:8px;padding:2px 0;cursor:pointer;min-width:0" onclick="event.stopPropagation();${go(k, r.symbol)}"><b style="width:70px;flex:none">${esc(r.symbol)}</b>` +
      `<span class="muted" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><span style="flex:none">${pup(r.fc.p_up)}</span></div>`;
    const nw = d.v7 && d.v7.news;
    return `<div class="card mcard" onclick="location.hash='#/${k}/overview'"><h3>${M.region} · ${M.name} ${statusChip(d)}</h3>` +
      `<div class="muted" style="margin-bottom:8px">close ${esc(d.asof)} · ${d.universe} stocks ranked · price forecasts: forward test</div>` +
      (nw ? `<div style="margin:6px 0 10px"><div class="muted" style="margin-bottom:4px">Market news (AI read, last 5 sessions): <b class="${cls(nw.market_index)}">${nw.market_index >= 0 ? '+' : ''}${nw.market_index.toFixed(2)}</b></div>` +
        `<div class="gauge"><i style="left:${(nw.market_index + 1) * 50}%"></i></div></div>` : '') +
      (k === 'sgx' && mo && mo.status && mo.status !== 'none' ? `<div class="muted" style="margin-bottom:8px">Momentum test: <span class="chip warn">${esc(mo.status)}</span> ${mo.matured_months} of ${mo.needed_months} months scored</div>` : '') +
      `<div class="two" style="gap:12px;grid-template-columns:1fr 1fr"><div><div class="muted">Highest chance up (5 days)</div>${byUp.slice(0, 5).map(li).join('')}</div>` +
      `<div><div class="muted">Lowest chance up</div>${byUp.slice(-5).reverse().map(li).join('')}</div></div>` +

function drawRecord(d, M) {
  const h = d.history; if (!h || !h.series || !window.LightweightCharts || !$('eq')) return;
  const opts = { layout: { background: { color: '#14181d' }, textColor: '#8a93a0' }, grid: { vertLines: { color: '#1b2027' }, horzLines: { color: '#1b2027' } },
    rightPriceScale: { borderColor: '#262c34' }, timeScale: { borderColor: '#262c34' }, autoSize: true };
  const eq = LightweightCharts.createChart($('eq'), opts), ic = LightweightCharts.createChart($('icc'), opts);
  charts.push(eq, ic);
  const cum = (rows, k) => { let s = 0; return rows.map(r => ({ time: r[0], value: (s += r[k]) * 100 })); };
  eq.addLineSeries({ color: '#3987e5', lineWidth: 2, title: 'L/S 1% borrow' }).setData(cum(h.series.weeks, 1));
  eq.addLineSeries({ color: '#eda100', lineWidth: 1, title: 'L/S 10% borrow' }).setData(cum(h.series.weeks, 2));
  eq.addLineSeries({ color: '#16c784', lineWidth: 1, title: 'long-only − ' + M.bench }).setData(cum(h.series.weeks, 3));
  eq.timeScale().fitContent();
  const s = h.series.ic, avg = [];
  for (let i = 59; i < s.length; i++) { let m = 0; for (let k = i - 59; k <= i; k++) m += s[k][1]; avg.push({ time: s[i][0], value: m / 60 }); }
  const l = ic.addLineSeries({ color: '#3987e5', lineWidth: 2 }); l.setData(avg);
  l.createPriceLine({ price: 0, color: '#5d6672', lineWidth: 1, lineStyle: 2 }); ic.timeScale().fitContent();
  $('eqnote').textContent = `${h.series.weeks[0][0]} → ${h.series.weeks.at(-1)[0]}`;
}

  const f = r.fc, n = f && f.news, mo = m === 'sgx' ? await momentum() : null;
  const inMom = mo && (mo.provisional_picks || []).some(x => x.symbol === sym);
  const cards = [
    card('Today', [['close', `${M.ccy}${px(r.close)}`], ['rank score', `${r.score_pct.toFixed(0)} of 100`], ['decile', `${r.decile} of 10`], ['ranking', d.status && d.status.adopted === false ? 'not adopted' : 'adopted']]),
    card('vs other stocks (5 days)', [['expected vs median', pct(r.exp_rel_5d, 2)], ['chance to beat median', pct(r.p_beat, 0, false)], ['from', 'out-of-sample decile record']]),

    ['95% range', `${px(f.lo95)} – ${px(f.hi95)}`], ['P(up)', pup(f.p_up) + (n && n.n ? ` <span class="dim">→ with news</span> ${pup(n.p_up)}` : '')]]));

      `<td style="text-align:left;white-space:normal">${esc(x.headline)}</td></tr>`).join('') + '</tbody></table></div>' : '';
  const whyList = Object.entries(r.why || {}).filter(([, v]) => isFinite(v)).sort((a, b) => Math.abs(b[1] - 0.5) - Math.abs(a[1] - 0.5))

    `</div>`;
  const row = (k, label) => { const v = V[k]; if (!v) return '';
    return `<tr><td style="text-align:left">${label}</td><td class="num">${pup(v.p_up)}</td><td class="num ${cls(v.median - r.close)}">${px(v.median)} <span class="dim">${pct(v.exp_ret, 1)}</span></td>` +
      `<td class="num">${v.lo50 != null ? px(v.lo50) + ' – ' + px(v.hi50) : '—'}</td><td class="num dim">${px(v.lo80)} – ${px(v.hi80)}</td><td>${sigChip(v.signal)}</td></tr>`; };
  const cmp = `<table style="margin-bottom:12px"><thead><tr><th style="text-align:left">View</th><th>P(up)</th><th>Median</th><th>50% range</th><th>80% range</th><th>Signal</th></tr></thead><tbody>` +
    row('total', 'Qwen + models') + row('qwen', 'Qwen only') + row('model', 'Model only (v7)') + '</tbody></table>';
  const li = xs => xs.length ? xs.map(x => `<li>${esc(x)}</li>`).join('') : '<li class="dim">none given</li>';
  const reasons = `<div class="reasons"><div><b class="up">Positives</b><ul>${li(a.positives)}</ul></div><div><b class="down">Negatives</b><ul>${li(a.negatives)}</ul></div></div>`;
  const nw = r.news;
  const hl = nw ? (nw.headlines.length ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">The ${nw.headlines.length} headlines Qwen read (30 days to ${esc(nw.cutoff.slice(0, 16).replace('T', ' '))} UTC; ${nw.n_recap_removed} templated recaps removed)</summary><table><tbody>` +
      nw.headlines.map(h => `<tr><td class="dim" style="width:90px;text-align:left">${esc(h.t.slice(0, 10))}</td><td style="text-align:left;white-space:normal">${esc(h.headline)}</td></tr>`).join('') + '</tbody></table></details>'
      : '<div class="dim" style="margin-top:10px">No headlines about this stock in the last 30 days.</div>')
    : '<div class="dim" style="margin-top:10px">No news available for this market: Qwen judged from the numbers only.</div>';
  const peers = r.peers && r.peers.length ? `<div class="muted" style="margin-top:10px">Same-industry peers it considered: ${r.peers.map(p => `<a href="#/${m}/stock/${encodeURIComponent(p.symbol)}">${esc(p.symbol)}</a> <span class="${cls(p.news_dir)}">${p.news_dir > 0 ? '+' : ''}${p.news_dir.toFixed(1)}</span>`).join(' · ')}</div>` : '';
  return head + cmp + reasons + hl + peers +
    `<div class="dim" style="margin-top:10px">${esc(a.model)} on ${esc(a.device)} · ${a.seconds}s · ${esc((r.generated || '').replace('T', ' '))}. ` +
    `Qwen's chance of a rise is shrunk by a fixed weight (${t.w ?? '—'}) and added to the model's; the model sets the width of the range. ` +
    `All three views are logged before the outcome, and a forward test decides which is kept.</div>`;
}
const EVX = {};
async function evals(m) {                                       // cached AI evaluations for the latest close + forward-test score
  if (EVX[m]) return EVX[m];
  try { EVX[m] = await (await fetch('/api/stock/evals?market=' + m)).json(); } catch (e) { EVX[m] = { index: {} }; }
  return EVX[m];
}

// ---------------------------------------------------------------- router + search + refresh status
async function render() {
  const r = route();
  buildTree(r);
  charts.forEach(c => { try { c.remove(); } catch (e) { } }); charts = [];
  const scrollY = r.key === render.lastKey ? window.scrollY : 0;
  let html;
  try {
    html = r.v === 'all' ? await viewAll() : r.v === 'overview' ? await viewOverview(r.m) : r.v === 'rankings' ? await viewRankings(r.m)
      : r.v === 'forecasts' ? await viewForecasts(r.m) : r.v === 'news' ? await viewNews(r.m) : r.v === 'momentum' ? await viewMomentum(r.m)
      : r.v === 'record' ? await viewRecord(r.m) : r.v === 'indexes' ? await viewIndexes(r.m) : r.v === 'sector' ? await viewSector(r.m, r.key)
      : r.v === 'index' ? await viewIndex(r.m, r.sym) : await viewStock(r.m, r.sym);
  } catch (e) { html = `<div class="empty">Something went wrong: ${esc(e.message)}</div>`; }
  $('view').innerHTML = html;
  buildTree(r);
  document.title = 'AI Trademaster · ' + ($('crumbs').textContent || 'Markets');
  if (location.hash !== render.lastHash) window.scrollTo(0, 0);
  render.lastHash = location.hash;
}
function rerenderKeep(id) {                                     // re-render a view while typing in its filter box
  const pos = $(id) ? $(id).selectionStart : 0;
  render().then(() => { const el = $(id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } });
}
window.addEventListener('hashchange', render);
$('navsel').addEventListener('change', e => { location.hash = e.target.value; });

let suggIdx = 0, suggItems = [];
async function suggest() {
  const raw = $('q').value, box = $('sugg');
  if (!raw.trim()) { box.style.display = 'none'; return; }
  const found = await window.tmSearch.find(raw);
  if (raw !== $('q').value) return;                              // typed on meanwhile
  suggItems = found; suggIdx = 0;
  box.innerHTML = suggItems.map((x, i) => `<div class="${i === 0 ? 'on' : ''}" onmousedown="pickSugg(${i})"><b style="width:70px;flex:none">${esc(x.k === 'sector' ? '' : x.s)}</b>` +
    `<span class="muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(window.tmSearch.clean(x.n))}</span><span class="chip">${window.tmSearch.chip(x)}</span></div>`).join('') ||
    '<div class="dim">No stock, index or sector matches</div>';
  box.style.display = 'block';
}
function pickSugg(i) { const it = suggItems[i]; if (!it) return; location.hash = window.tmSearch.href(it).replace('/markets', ''); $('q').value = ''; $('sugg').style.display = 'none'; $('q').blur(); }
$('q').addEventListener('input', suggest);
$('q').addEventListener('blur', () => setTimeout(() => ($('sugg').style.display = 'none'), 150));
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { pickSugg(suggIdx); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    suggIdx = Math.max(0, Math.min(suggItems.length - 1, suggIdx + (e.key === 'ArrowDown' ? 1 : -1)));
    [...$('sugg').children].forEach((c, i) => c.classList.toggle('on', i === suggIdx)); e.preventDefault();
  } else if (e.key === 'Escape') { $('sugg').style.display = 'none'; }
});

let wasRunning = false;
async function pollRefresh() {
  try {
    const s = await (await fetch('/api/rankings/status')).json(), el = $('upd');
    if (s.time) LASTCHECK = s.time;
    if (s.state === 'running') { el.style.display = ''; el.className = 'chip warn'; el.textContent = 'UPDATING · ' + s.step; wasRunning = true; }
    else if (s.state === 'error') { el.style.display = ''; el.className = 'chip bad'; el.textContent = 'UPDATE FAILED'; el.title = s.step; }
    else if (s.state === 'done') {
      el.style.display = ''; el.className = 'chip ok'; el.textContent = 'UP TO DATE'; el.title = s.step + ' at ' + s.time;
      if (wasRunning) { wasRunning = false; for (const k in DATA) delete DATA[k]; for (const k in LOADING) delete LOADING[k]; MOM = null; IDX = null; render(); }
    }
  } catch (e) { }
  setTimeout(pollRefresh, 10000);
}
if (!location.hash) history.replaceState(null, '', '#/all');
render();
Promise.all([data('nasdaq'), data('sgx')]).then(() => buildTree(route()));
pollRefresh();
</script>
<script src="/nav.js"></script>
</body>
